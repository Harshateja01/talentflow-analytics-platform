talentflow:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('TALENTFLOW_DUCKDB_PATH', 'data/warehouse/talentflow.duckdb') }}"
      threads: 2
      schema: talentflow_staging

    bigquery:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'talentflow-prod') }}"
      dataset: "{{ env_var('BQ_STAGING_DATASET', 'talentflow_staging') }}"
      threads: 4
      timeout_seconds: 300
      location: "{{ env_var('GCP_REGION', 'us-central1') }}"
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
